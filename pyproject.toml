[project]
name = "quarantine-dq"
version = "0.1.0"
description = "Platform-agnostic dead letter queue for data pipelines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ATHARNAWAZ" }]
keywords = ["data-engineering", "etl", "data-quality", "dead-letter-queue", "pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "duckdb>=0.10",
    "click>=8.0",
    "rich>=13.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
spark = ["pyspark>=3.3"]
llm = ["anthropic>=0.25"]
api = ["fastapi>=0.100", "uvicorn>=0.22", "httpx>=0.24"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.24",
    "pandas>=1.5",
]
all = ["quarantine-dq[postgres,llm,api]"]

[project.scripts]
quarantine = "quarantine.cli.main:cli"

[project.urls]
Homepage = "https://github.com/ATHARNAWAZ/quarantine-dq"
Repository = "https://github.com/ATHARNAWAZ/quarantine-dq"
Issues = "https://github.com/ATHARNAWAZ/quarantine-dq/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quarantine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
